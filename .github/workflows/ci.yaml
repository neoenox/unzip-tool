name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      upload-artifacts: true
      artifact-name: KantanKaiko-windows

  tests-newer-python:
    # exe is built with 3.11; verify the sources also pass on a newer Python.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install UnRAR for format tests
        shell: pwsh
        run: ./scripts/ci-install-unrar.ps1
      - name: Run tests under pytest
        run: python -m pytest --tb=short -q
