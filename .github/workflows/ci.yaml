name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install UnRAR for format tests
        run: choco install unrar -y
      - name: Fetch UnRAR for bundling
        run: python scripts/fetch_unrar.py --dest tools/UnRAR.exe
      - name: Run tests
        run: python tests/run_all.py
      - name: Build executable
        shell: pwsh
        run: |
          $addBin = @()
          if (Test-Path tools/UnRAR.exe) { $addBin = @('--add-binary', 'tools/UnRAR.exe;tools') }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KantanKaiko @addBin app.py
      - name: Build installer
        run: ./scripts/build-installer.ps1 -Version 1.0.1
      - name: Test installer
        run: ./scripts/test-installer.ps1 -InstallerPath dist/KantanKaiko-Setup-1.0.1.exe -Version 1.0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KantanKaiko-windows
          path: |
            dist/KantanKaiko.exe
            dist/KantanKaiko-Setup-1.0.1.exe
