name: build-exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Verify application version matches release tag
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'from version import VERSION; print(VERSION)')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match version.py ($version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      upload-artifacts: true
      artifact-name: windows-release

  release:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-release
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/KantanKaiko.exe
            dist/KantanKaiko-Setup-*.exe
          fail_on_unmatched_files: true
