name: build-exe

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit already merged into main."
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: Install unrar (for tests)
        run: choco install unrar -y
      - name: Fetch UnRAR for bundling
        run: python scripts/fetch_unrar.py --dest tools/UnRAR.exe
      - name: Test
        run: python tests/run_all.py
      - name: Build exe
        shell: pwsh
        run: |
          $addBin = @()
          if (Test-Path tools/UnRAR.exe) { $addBin = @('--add-binary', 'tools/UnRAR.exe;tools') }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KantanKaiko @addBin app.py
      - name: Verify release executable
        shell: pwsh
        run: |
          $executable = Get-Item -LiteralPath dist/KantanKaiko.exe -ErrorAction Stop
          if ($executable.PSIsContainer -or $executable.Length -eq 0) {
            throw "Release executable is missing or empty."
          }
      - name: Build installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build-installer.ps1 -Version ($env:RELEASE_TAG -replace '^v', '')
      - name: Test installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          ./scripts/test-installer.ps1 -InstallerPath "dist/KantanKaiko-Setup-$version.exe" -Version $version
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/KantanKaiko.exe
            dist/KantanKaiko-Setup-*.exe
            tools/UnRAR.exe
          fail_on_unmatched_files: true
